algo: ppo
env_id: CartPole-v1
num_envs: 16
seed: 0
total_timesteps: 100000
log_interval: 1

policy: MlpPolicy
learning_rate: 0.0003
n_steps: 256
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
clip_range_vf: null
normalize_advantage: true
ent_coef: 0.0
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null
stats_window_size: 100

policy_kwargs:
  net_arch: [64, 64]
